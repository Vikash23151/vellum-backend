# Test profile: uses H2 in-memory database instead of MySQL

spring:
  datasource:
    # H2 in-memory database URL
    # MODE=MySQL: H2 mimics MySQL SQL syntax
    # DB_CLOSE_DELAY=-1: keep DB open as long as JVM runs
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # create tables before tests, drop after
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Disable security auto-config that might interfere with tests
  security:
    oauth2:
      client:
        registration: {}  # empty = no OAuth2 in tests

jwt:
  secret: ${JWT_SECRET:vellumSuperSecretKeyThatIsAtLeast256BitsLong1234567890}
  expiry: 86400000

logging:
  level:
    com.vellum.auth: DEBUG
    org.springframework.security: WARN  # reduce noise in test output