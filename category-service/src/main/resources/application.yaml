server:
  port: 8084

spring:
  application:
    name: vellum-category-service

  datasource:
    url: jdbc:mysql://localhost:3306/vellum_category?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: vellum
    password: vellum123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vellum.category: DEBUG
